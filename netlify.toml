# https://docs.netlify.com/frameworks/next-js/overview/
[build]
command = "npm run build"

# NEXT_PUBLIC_* values are intentionally embedded in the client bundle; Firebase rules
# mirror author allowlists. Omit from Netlify secret scanning (ntl.fyi/configure-secrets-scanning).
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_AUTHOR_EMAILS,NEXT_PUBLIC_AUTHOR_UIDS,NEXT_PUBLIC_AUTHOR_IDLE_MINUTES,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET"
SECRETS_SCAN_OMIT_PATHS = "firestore.rules,storage.rules,.env.example,.firebaserc,README.md"

[[plugins]]
package = "@netlify/plugin-nextjs"
